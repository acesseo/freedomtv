<!DOCTYPE html>
<html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreedomTV Fluxo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
body{margin:0;font-family:Montserrat,sans-serif;background:radial-gradient(circle at top,#1a0000,#0a0a0a);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.step{display:none;text-align:center;width:90%;max-width:900px}.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(254,11,19,.3);border-radius:15px;padding:30px;cursor:pointer}
.card:hover{background:rgba(254,11,19,.15)}
i{font-size:48px;color:#FE0B13}.btn{margin-top:30px;padding:12px 30px;border-radius:40px;border:1px solid #fff;background:none;color:#fff;cursor:pointer}
</style></head><body>
<div id=s2 class="step active"><h1>ONDE VOCÊ VAI ASSISTIR?</h1><div class=grid>
<div class=card onclick="go('tv')"><i class="fas fa-tv"></i><h2>Na TV</h2></div>
<div class=card onclick="go('cell')"><i class="fas fa-mobile-alt"></i><h2>No Celular</h2></div></div></div>

<div id=tv class=step><h1>SISTEMA DA TV</h1><div class=grid>
<div class=card onclick="app('Samsung','Bob Player')"><h3>Samsung (Tizen)</h3></div>
<div class=card onclick="app('LG','Max Player')"><h3>LG (webOS)</h3></div>
<div class=card onclick="app('Android TV','Downloader')"><h3>Android TV</h3></div>
<div class=card onclick="app('Roku','Bob Player')"><h3>Roku</h3></div></div><button class=btn onclick="go('s2')">Voltar</button></div>

<div id=cell class=step><h1>SISTEMA DO CELULAR</h1><div class=grid>
<div class=card onclick="app('Android','XCIPTV')"><h3>Android</h3></div>
<div class=card onclick="app('iPhone','Smarters Player')"><h3>iPhone</h3></div></div><button class=btn onclick="go('s2')">Voltar</button></div>

<div id=app class=step><h1 id=t1></h1><p id=t2></p><button class=btn onclick="go('tutorial')">Continuar</button></div>
<div id=tutorial class=step><h1>TUTORIAL</h1><p>Instale o aplicativo informado e siga as instruções de configuração.</p><button class=btn onclick="finish()">Receber Acesso</button></div>

<script>
let flow={device:'',system:'',app:''};
function show(id){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function go(id){if(id==='tv')flow.device='TV';if(id==='cell')flow.device='Celular';show(id)}
function app(sys,ap){flow.system=sys;flow.app=ap;document.getElementById('t1').innerText='Aplicativo';document.getElementById('t2').innerHTML='Sistema: <b>'+sys+'</b><br>Instale: <b>'+ap+'</b>';show('app')}
function finish(){let msg=`Olá!%0ADispositivo: ${flow.device}%0ASistema: ${flow.system}%0AAplicativo: ${flow.app}%0AGostaria de receber meu acesso.`;location.href='https://wa.me/553197760051?text='+msg;}
</script></body></html>
